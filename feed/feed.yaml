  description: "In <a href=\"https://libertystreeteconomics.newyorkfed.org/2025/10/end-of-month-activity-across-the-treasury-market/\"\
    >past work</a>, we showed that trading in U.S. Treasury securities is becoming\
    \ increasingly concentrated on the last trading day of each month. In this post,\
    \ we show that trading is also becoming more concentrated around the designated\
    \ pricing, or \u201Cstrike,\u201D times for fixed-income indexes. The concentration\
    \ is especially pronounced on month-end trading days. We also document a marked\
    \ shift in trading activity from around 3 p.m. (ET) to around 4 p.m. after a major\
    \ fixed-income index provider moved its strike time from 3 p.m. to 4 p.m. in January\
    \ 2021."
