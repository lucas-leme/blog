  description: "From the Great Recession until 2019, U.S. labor productivity growth\
    \ disappointed. Nonfarm-business output per hour grew about 1 percent a year from\
    \ 2010 to 2019, down from 3 percent in the late 1990s. This slowdown was especially\
    \ pronounced in manufacturing, and it coincided with a <a href=\"https://libertystreeteconomics.newyorkfed.org/2024/07/the-mysterious-slowdown-in-u-s-manufacturing-productivity/\"\
    >slowdown</a> in the growth of revenue per worker among public firms. However,\
    \ since 2019, <a href=\"https://www.frbsf.org/research-and-insights/publications/economic-letter/2026/05/have-we-entered-era-of-high-productivity-growth/\"\
    >growth</a> has picked up to twice\_the 2010s rate, around 2 percent. In this\
    \ post, I use data from firms\u2019 10-K filings to unpack this recent acceleration.\
    \ I first show that the acceleration appears in public firms\u2019 revenue per\
    \ worker, then document how the gains went into profit margins, and finally, what\
    \ firm characteristics predicted significant profit margin increases. The increase\
    \ in profit margins is consistent with ongoing declines in the labor share of\
    \ <a href=\"https://libertystreeteconomics.newyorkfed.org/2026/06/the-post-covid-decline-in-the-labor-share/\"\
    >output</a>."
  image: https://d3g9pb5nvr3u7.cloudfront.net/sites/59dd2d9d016a1b2d929cd15b/-1445257209/256.jpg
  path: https://libertystreeteconomics.newyorkfed.org/2026/10/revenue-per-worker-is-up-are-firms-getting-a-larger-share/
  title: Revenue per Worker Is Up. Are Firms Getting a Larger Share?
