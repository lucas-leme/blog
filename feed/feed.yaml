  description: "Faltam apenas 5 dias para as Elei\xE7\xF5es 2026. Mas, para o investidor,\
    \ a grande quest\xE3o n\xE3o \xE9 apenas quem vence a elei\xE7\xE3o \u2014 \xE9\
    \ o que acontece com Bolsa, d\xF3lar, juros e economia depois das urnas.Neste\
    \ epis\xF3dio especial do Market Makers, Thiago Salom\xE3o e Leopoldo Rosa recebem\
    \ Andr\xE9 Leite, CIO da TAG Investimentos, para analisar os principais cen\xE1\
    rios que podem afetar o patrim\xF4nio dos investidores antes e depois da elei\xE7\
    \xE3o presidencial.Ao longo da conversa, discutimos o que j\xE1 pode estar precificado\
