  description: Nearly every investing conversation in 2026 came back to AI, and the
    borrowing behind it has changed how credit investors look for opportunity. In
    our latest episode on the convergence of public and private credit markets, Apollo
    Partners Brian Weinstein and John Cortese discuss how AI accelerated that convergence
    in 2026, why the barriers between the two markets are expected to continue to
    erode in 2027, and why credit investors may need to look across the full credit
    spectrum to find the best opportunities. The conversation explores how changing
    correlations may create opportunities to reposition portfolios, emphasizing relative
    value, collateral quality, structure and selectivity. With massive capital needs
    continuing to drive issuance and high-quality credit offering increasingly attractive
    return potential, Weinstein and Cortese consider how investors can rethink diversification,
    liquidity and risk allocation, and why active portfolio construction could become
    increasingly important in the year ahead.
