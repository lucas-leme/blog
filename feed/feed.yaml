  description: "Como Fl\xE1vio Bolsonaro pretende vencer a elei\xE7\xE3o presidencial\
    \ de 2026? E quais seriam as primeiras medidas de seu governo caso chegasse ao\
    \ Pal\xE1cio do Planalto?Neste epis\xF3dio do Market Makers, Thiago Salom\xE3\
    o e Leopoldo Rosa recebem Fl\xE1vio Bolsonaro e Daniella Marques para uma conversa\
    \ aprofundada sobre estrat\xE9gia eleitoral, plano de governo e os desafios de\
    \ administrar o Brasil.Fl\xE1vio explica como pretende ampliar sua base eleitoral,\
