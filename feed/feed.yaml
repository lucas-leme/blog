    investors. In this post, based on our recent\_<a href=\"https://www.newyorkfed.org/research/staff_reports/sr1172\"\
    \ rel=\"noreferrer noopener\" target=\"_blank\">Staff Report</a>, we document\_\
    that domestic U.S. stocks expose investors to substantial geoeconomic risk through\
    \ firms' global supply-chain relationships, affecting investors' returns and portfolio\
    \ allocation. We also find that investors are compensated for bearing geoeconomic\
    \ risk through higher risk premia."
