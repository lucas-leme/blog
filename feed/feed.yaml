  description: A long-standing body of research, inspired by Bernanke and Kuttner
    (2005), has documented the effects of Fed interest rate surprises on stock markets.
    While stock markets provide valuable information about the investor risk premium
    and dividend growth expectations, researchers have only recently developed more
    comprehensive tools to estimate the term structure of equity risk premia and dividend
    growth expectations across a broad range of maturities. In this post, we investigate
    the impact of monetary policy surprises (or shocks) on short- and long-term estimates
    of risk premia and growth expectations through the lens of the <a href="https://onlinelibrary.wiley.com/doi/full/10.1111/jofi.13394">Giglio,
    Kelly, and Kozak (2024) model</a>.
