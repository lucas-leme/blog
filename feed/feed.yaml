  description: "Geoeconomic risk\u2014the risk that firms incur valuation losses when\
    \ countries deploy economic, trade, or financial leverage for geopolitical aims\u2014\
    has become a\_<a href=\"https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/what-matters-most-to-investors-in-2026-and-what-it-means-for-companies\"\
