  date: '2026-11-16T00:00:00+00:00'
  description: "In this episode, I speak with Richard Falk-Wallace, founder of Arcana.Richard\
    \ began his career in restructuring at JPMorgan and distressed credit at Silver\
    \ Point before moving to equities, covering natural resources at Viking and later\
    \ as a portfolio manager at Citadel. In the seat, he noticed a gap. Factor risk\
    \ models had been built for the back office, and as Richard put it to me, \u201C\
    the risk tooling doesn\u2019t work for the PMs.\u201D Arcana is his answer.We\
    \ discuss the convergence of quant and discretionary investing, and why the portfolio\
    \ construction lessons quants learned long ago are finally landing on the fundamental\
    \ PM\u2019s desk. Richard explains how a PM can get a factor bet right and still\
    \ drag down their book\u2019s Sharpe ratio, and what breaking a track record into\
    \ sizing, selection, and timing reveals about skill.We close by exploring the\
    \ second-order effects: crowding when everyone neutralizes the same factors, fleeting\
    \ themes like AI power demand, and when more information starts to make investors\
    \ worse.Please enjoy my conversation with Richard Falk-Wallace."
