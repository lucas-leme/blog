  description: "<div class=\"ExternalClass6E93F6AC48184ADBB4D397BC268E625D\"><p>\u200B\
    O ambiente externo permanece incerto em fun\xE7\xE3o da indefini\xE7\xE3o acerca\
    \ dos conflitos armados no Oriente M\xE9dio e da incerteza sobre a pol\xEDtica\
    \ monet\xE1ria em algumas economias avan\xE7adas. Tal cen\xE1rio exige cautela\
    \ por parte de pa\xEDses emergentes em ambiente marcado por eleva\xE7\xE3o da\
    \ volatilidade de pre\xE7os de ativos e <em>commodities</em>.</p><p>Em rela\xE7\
    \xE3o ao cen\xE1rio dom\xE9stico, o conjunto dos indicadores divulgados desde\
    \ a \xFAltima reuni\xE3o sugere uma modera\xE7\xE3o gradual da atividade econ\xF4\
    mica, embora ainda em patamar resiliente, com sinais mistos entre setores, e mercado\
    \ de trabalho aquecido. Nas divulga\xE7\xF5es mais recentes, a infla\xE7\xE3o\
    \ cheia desacelerou, por\xE9m ainda acima do limite superior da meta, enquanto\
    \ as medidas subjacentes desaceleraram para patamar ligeiramente abaixo do limite\
    \ superior da meta.</p><p>As expectativas de infla\xE7\xE3o para 2026 e 2027 apuradas\
    \ pela pesquisa Focus permanecem em valores acima da meta, situando-se em 5,0%\
    \ e 4,2%, respectivamente. A proje\xE7\xE3o de infla\xE7\xE3o do Copom para o\
    \ primeiro trimestre de 2028, atual horizonte relevante de pol\xEDtica monet\xE1\
    ria, situa-se em 3,2% no cen\xE1rio de refer\xEAncia (Tabela 1).</p><p>Os riscos\
    \ para a infla\xE7\xE3o, tanto de alta quanto de baixa, permanecem mais elevados\
    \ que o usual, com assimetria altista. Entre os riscos de alta para o cen\xE1\
    rio inflacion\xE1rio e as expectativas de infla\xE7\xE3o, destacam-se (i) uma\
    \ desancoragem das expectativas de infla\xE7\xE3o por per\xEDodo mais prolongado,\
    \ com horizontes mais longos incorporando impactos potenciais de segunda ordem\
    \ de choques de oferta, relacionados ao petr\xF3leo e seus derivados, e a efeitos\
    \ clim\xE1ticos sobre a produtividade agr\xEDcola e custos de energia; (ii) uma\
    \ maior resili\xEAncia na infla\xE7\xE3o de servi\xE7os do que a projetada em\
    \ fun\xE7\xE3o de um hiato do produto mais positivo; (iii) uma conjun\xE7\xE3\
    o de pol\xEDticas econ\xF4micas externa e interna que tenham impacto inflacion\xE1\
    rio maior que o esperado, por exemplo, por meio de uma taxa de c\xE2mbio persistentemente\
    \ mais depreciada; e (iv) est\xEDmulos \xE0 demanda agregada, em particular ao\
    \ componente de consumo, que tenham como resultado o crescimento da atividade\
    \ econ\xF4mica acima do produto potencial, enfraquecendo parte dos canais usuais\
    \ de transmiss\xE3o da pol\xEDtica monet\xE1ria. Entre os riscos de baixa, ressaltam-se\
    \ (i) uma eventual desacelera\xE7\xE3o da atividade econ\xF4mica dom\xE9stica\
    \ mais acentuada do que a projetada, tendo impactos sobre o cen\xE1rio de infla\xE7\
    \xE3o; (ii) uma desacelera\xE7\xE3o global mais pronunciada decorrente dos choques\
    \ de com\xE9rcio e do petr\xF3leo, e de um cen\xE1rio de maior incerteza; e (iii)\
    \ uma redu\xE7\xE3o nos pre\xE7os das <em>commodities</em> com efeitos desinflacion\xE1\
    rios.</p><p>O Comit\xEA segue acompanhando como os desenvolvimentos da pol\xED\
    tica fiscal dom\xE9stica impactam a pol\xEDtica monet\xE1ria e os ativos financeiros,\
    \ refor\xE7ando a postura de cautela em cen\xE1rio de maior incerteza. Os indicadores\
    \ correntes de atividade mant\xEAm-se consistentes com uma trajet\xF3ria de desacelera\xE7\
    \xE3o no acumulado de 2026. O Comit\xEA monitora com aten\xE7\xE3o a desancoragem\
    \ adicional das expectativas de infla\xE7\xE3o para prazos mais longos na medida\
    \ em que esta contribui para a determina\xE7\xE3o dos pre\xE7os e aumenta o custo\
    \ de desinfla\xE7\xE3o.</p><p>Em decorr\xEAncia da din\xE2mica dos riscos associados\
    \ \xE0 evolu\xE7\xE3o dos pre\xE7os, o Comit\xEA reafirma que a magnitude total\
    \ do ciclo de calibra\xE7\xE3o ser\xE1 estabelecida \xE0 luz de novas informa\xE7\
    \xF5es visando assegurar a converg\xEAncia da infla\xE7\xE3o \xE0 meta. </p><p>O\
    \ Copom decidiu reduzir a taxa b\xE1sica de juros para 14,00% a.a., e entende\
    \ que essa decis\xE3o \xE9 compat\xEDvel com a estrat\xE9gia de converg\xEAncia\
    \ da infla\xE7\xE3o para o redor da meta ao longo do horizonte relevante. Sem\
    \ preju\xEDzo de seu objetivo fundamental de assegurar a estabilidade de pre\xE7\
    os, essa decis\xE3o tamb\xE9m implica suaviza\xE7\xE3o das flutua\xE7\xF5es do\
    \ n\xEDvel de atividade econ\xF4mica e fomento do pleno emprego.</p><p>&#160;O\
    \ cen\xE1rio atual, caracterizado por significativo aumento da incerteza, desancoragem\
    \ das expectativas e riscos elevados em torno do cen\xE1rio base, demanda serenidade\
    \ e cautela na condu\xE7\xE3o da pol\xEDtica monet\xE1ria. O Comit\xEA seguir\xE1\
    \ acompanhando a evolu\xE7\xE3o do cen\xE1rio de forma a manter a restri\xE7\xE3\
    o adequada para assegurar a converg\xEAncia da infla\xE7\xE3o \xE0 meta.</p><p>Votaram\
    \ por essa decis\xE3o os seguintes membros do Comit\xEA&#58; Gabriel Muricca Gal\xED\
    polo (presidente), Ailton de Aquino Santos, Gilneu Francisco Astolfi Vivan, Izabela\
    \ Moreira Correa, Nilton Jos\xE9 Schneider David, Paulo Picchetti, e Rodrigo Alves\
    \ Teixeira.</p><p>Tabela 1</p><p>Proje\xE7\xF5es de infla\xE7\xE3o no cen\xE1\
    rio de refer\xEAncia</p><p>Varia\xE7\xE3o do IPCA acumulada em quatro trimestres\
    \ (%)</p><table cellspacing=\"0\" class=\"ms-rteTable-default\" width=\"100%\"\
    ><tbody><tr><td class=\"ms-rteTable-default\">\xCDndice de pre\xE7os</td><td class=\"\
    ms-rteTable-default\">2026</td><td class=\"ms-rteTable-default\">2027</td><td\
    \ class=\"ms-rteTable-default\">1\xBA tri 2028</td></tr><tr><td class=\"ms-rteTable-default\"\
    >IPCA</td><td class=\"ms-rteTable-default\">5,1</td><td class=\"ms-rteTable-default\"\
    >3,8</td><td class=\"ms-rteTable-default\">3,2</td></tr><tr><td class=\"ms-rteTable-default\"\
    >IPCA livres</td><td class=\"ms-rteTable-default\">5,1</td><td class=\"ms-rteTable-default\"\
    >3,9</td><td class=\"ms-rteTable-default\">3,1</td></tr><tr><td class=\"ms-rteTable-default\"\
    >IPCA administrados</td><td class=\"ms-rteTable-default\">4,9</td><td class=\"\
    ms-rteTable-default\">3,5</td><td class=\"ms-rteTable-default\">3,5</td></tr></tbody></table><p>&#160;</p><p><sub>No\
    \ cen\xE1rio de refer\xEAncia, a trajet\xF3ria para a taxa de juros \xE9 extra\xED\
    da da pesquisa Focus e a taxa de c\xE2mbio parte de R$5,10 /US$, evoluindo segundo\
    \ a paridade do poder de compra (PPC). O pre\xE7o do petr\xF3leo segue aproximadamente\
    \ a curva futura pelos pr\xF3ximos seis meses e passa a aumentar 2% ao ano posteriormente.\
    \ Al\xE9m disso, adota-se a hip\xF3tese de bandeira tarif\xE1ria \u201Camarela&quot;\
    \ em dezembro de 2026 e de 2027. O valor para o c\xE2mbio foi obtido pelo procedimento\
    \ usual.</sub></p><p><br /></p></div>"
