  description: In this upcoming episode of Conversations with Frank Fabozzi, CFA,
    Kari Vatanen, CFA draws on decades of experience in asset allocation, risk management,
    derivatives, and pension investing to examine how portfolio construction is evolving
    beyond traditional models. As inflation uncertainty, private markets, and shifting
    market dynamics reshape investment decisions, he explores the rise of total portfolio
    thinking, the growing role of alternative investments and factor-based approaches,
    and why integrating risk management into strategic decision-making is more important
    than ever.
