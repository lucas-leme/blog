  description: "<div id=\"atacompleta\"><div id=\"ataconteudo\"><h3 class=\"secao\"\
    >A) Atualiza\xE7\xE3o da conjuntura econ\xF4mica e do cen\xE1rio do Copom<sup>1</sup></h3><p\
    \ class=\"paragrafo\">1. O ambiente externo tornou-se mais adverso em fun\xE7\xE3\
    o do prolongamento dos conflitos armados no Oriente M\xE9dio, com impactos altistas\
    \ sobre o pre\xE7o do petr\xF3leo e derivados, e da pol\xEDtica monet\xE1ria mais\
    \ restritiva nas economias avan\xE7adas. Tal cen\xE1rio exige cautela por parte\
    \ de pa\xEDses emergentes em ambiente marcado por eleva\xE7\xE3o da volatilidade\
    \ de pre\xE7os de ativos e <i>commodities</i>.</p><p class=\"paragrafo\">2. Em\
    \ rela\xE7\xE3o ao cen\xE1rio dom\xE9stico, o conjunto dos indicadores divulgados\
    \ desde a \xFAltima reuni\xE3o aponta para uma modera\xE7\xE3o mais acentuada\
    \ da atividade econ\xF4mica, principalmente em setores mais c\xEDclicos. O mercado\
    \ de trabalho permanece resiliente, por\xE9m apresentando sinais de desaquecimento\
    \ na margem. Nas divulga\xE7\xF5es mais recentes, a infla\xE7\xE3o cheia e a m\xE9\
    dia das medidas subjacentes aceleraram, situando-se acima do limite superior do\
    \ intervalo de toler\xE2ncia da meta.</p><p class=\"paragrafo\">3. As expectativas\
    \ de infla\xE7\xE3o para 2026 e 2027 apuradas pela pesquisa Focus distanciaram-se\
    \ adicionalmente em rela\xE7\xE3o \xE0 meta desde a \xFAltima reuni\xE3o, situando-se\
    \ em 5,2% e 4,8%, respectivamente. A proje\xE7\xE3o de infla\xE7\xE3o do Copom\
    \ para o segundo trimestre de 2028, atual horizonte relevante de pol\xEDtica monet\xE1\
    ria, elevou-se para 3,5% no cen\xE1rio de refer\xEAncia (Tabela 1), com a incorpora\xE7\
    \xE3o dos choques de oferta materializados desde a \xFAltima reuni\xE3o. O Copom\
    \ relembra que essa proje\xE7\xE3o utiliza a trajet\xF3ria da Selic extra\xED\
    da da Focus.</p><h3 class=\"secao\">B) Cen\xE1rios e an\xE1lise de riscos</h3><p\
    \ class=\"paragrafo\">4. A incerteza com rela\xE7\xE3o ao cen\xE1rio externo segue\
    \ em n\xEDveis elevados. A continuidade de indefini\xE7\xF5es em rela\xE7\xE3\
    o aos desdobramentos das tens\xF5es geopol\xEDticas e seus efeitos sobre pre\xE7\
    os de <i>commodities</i> e insumos alteraram expectativas sobre a condu\xE7\xE3\
    o da pol\xEDtica monet\xE1ria nas principais economias avan\xE7adas.</p><p class=\"\
    paragrafo\">5. O Comit\xEA avalia que a modera\xE7\xE3o da atividade econ\xF4\
    mica dom\xE9stica, demonstrada pelo resultado do PIB no segundo trimestre de 2026,\
    \ pode acentuar-se, de acordo com indicadores de maior frequ\xEAncia mais recentes.\
    \ Os resultados de pesquisas de desempenho do com\xE9rcio demonstram inflex\xE3\
    o, especialmente nos segmentos mais sens\xEDveis ao cr\xE9dito. Esse resultado\
    \ \xE9 esperado em um contexto em que a pol\xEDtica monet\xE1ria em patamar restritivo\
    \ mant\xE9m taxas de juros do cr\xE9dito livre bastante elevadas, tanto no segmento\
    \ de pessoas f\xEDsicas quanto no de pessoas jur\xEDdicas. O Comit\xEA relembra\
    \ que o arrefecimento da demanda agregada \xE9 um elemento essencial do processo\
    \ de reequil\xEDbrio entre oferta e demanda da economia e converg\xEAncia da infla\xE7\
    \xE3o \xE0 meta.</p><p class=\"paragrafo\">6. O Comit\xEA segue acompanhando detidamente\
    \ o mercado de trabalho. A taxa de desemprego mant\xE9m-se em patamares historicamente\
    \ baixos, enquanto o crescimento da taxa de ocupa\xE7\xE3o vem apresentando desacelera\xE7\
    \xE3o. Os rendimentos m\xE9dios desaceleraram na margem, mesmo em termos nominais,\
    \ mas ainda crescem em termos reais a uma taxa superior \xE0 da produtividade\
    \ do trabalho. O Comit\xEA segue atento ao debate sobre as dimens\xF5es corrente\
    \ e estrutural do mercado de trabalho, enfatizando a necessidade do aprofundamento\
    \ dessa an\xE1lise para a avalia\xE7\xE3o dos padr\xF5es de transmiss\xE3o dos\
    \ n\xEDveis de ocupa\xE7\xE3o para os rendimentos do trabalho e, finalmente, para\
    \ os pre\xE7os dos diversos setores da economia.</p><p class=\"paragrafo\">7.\
    \ A pol\xEDtica fiscal tem um impacto de curto prazo, majoritariamente por meio\
    \ de est\xEDmulo \xE0 demanda agregada, e uma dimens\xE3o mais estrutural, que\
    \ tem potencial de afetar a percep\xE7\xE3o sobre a sustentabilidade da d\xED\
    vida e impactar o pr\xEAmio a termo da curva de juros. Uma pol\xEDtica fiscal\
    \ que atue de forma contrac\xEDclica e contribua para a redu\xE7\xE3o do pr\xEA\
    mio de risco favorece a converg\xEAncia da infla\xE7\xE3o \xE0 meta. O Comit\xEA\
    \ reafirma a vis\xE3o de que o esmorecimento no esfor\xE7o de reformas estruturais\
    \ e disciplina fiscal, o aumento de cr\xE9dito direcionado e as incertezas sobre\
    \ a estabiliza\xE7\xE3o da d\xEDvida p\xFAblica t\xEAm o potencial de elevar a\
    \ taxa de juros neutra da economia, com impactos delet\xE9rios sobre a pot\xEA\
    ncia da pol\xEDtica monet\xE1ria e, consequentemente, sobre o custo de desinfla\xE7\
    \xE3o em termos de atividade. O Comit\xEA mant\xE9m a firme convic\xE7\xE3o de\
    \ que as pol\xEDticas devem ser previs\xEDveis, cr\xEDveis e antic\xEDclicas.\
    \ Em particular, o debate do Comit\xEA refor\xE7a, novamente, a necessidade de\
    \ pol\xEDticas fiscal e monet\xE1ria harmoniosas.</p><p class=\"paragrafo\">8.\
    \ As leituras mais recentes mostraram acelera\xE7\xE3o da infla\xE7\xE3o ao consumidor,\
    \ tanto no \xEDndice cheio quanto na m\xE9dia das medidas subjacentes. Pelas duas\
    \ m\xE9tricas, o \xEDndice acumulado em 12 meses situa-se acima do limite superior\
    \ do intervalo de toler\xE2ncia da meta. Ainda sob a mesma perspectiva das varia\xE7\
    \xF5es acumuladas em 12 meses, nas divulga\xE7\xF5es mais recentes as varia\xE7\
    \xF5es de pre\xE7os aos produtores aceleraram, tanto em bens intermedi\xE1rios\
    \ quanto em bens de consumo.</p><p class=\"paragrafo\">9. As expectativas de infla\xE7\
    \xE3o, medidas por diferentes instrumentos e obtidas de diferentes grupos de agentes\
    \ elevaram-se, permanecendo acima da meta de infla\xE7\xE3o em todos os horizontes.\
    \ Foi ressaltado que o custo de desinfla\xE7\xE3o sobre o n\xEDvel de atividade\
    \ ao longo do tempo \xE9 maior em ambientes com expectativas desancoradas. O Comit\xEA\
    \ monitora com aten\xE7\xE3o a desancoragem das expectativas de infla\xE7\xE3\
    o para prazos mais longos e tem debatido as poss\xEDveis causas desse movimento\
    \ das expectativas. O Comit\xEA avalia que perseveran\xE7a, firmeza e serenidade\
    \ na condu\xE7\xE3o da pol\xEDtica monet\xE1ria contribuir\xE3o para a reancoragem\
    \ das expectativas, importante para a converg\xEAncia da infla\xE7\xE3o \xE0 meta\
    \ com menor custo. A principal conclus\xE3o obtida, e compartilhada por todos\
    \ os membros do Comit\xEA, foi a de que, em um ambiente de expectativas desancoradas,\
    \ como \xE9 o caso do atual, exige-se uma restri\xE7\xE3o monet\xE1ria maior e\
    \ por mais tempo do que outrora seria apropriado.</p><p class=\"paragrafo\">10.\
    \ O cen\xE1rio, caracterizado por expectativas de infla\xE7\xE3o mais elevadas\
    \ e redu\xE7\xE3o nas proje\xE7\xF5es de crescimento, reflete a combina\xE7\xE3\
    o de sinais mais evidentes de desacelera\xE7\xE3o da economia dom\xE9stica juntamente\
    \ com quatro choques de oferta: (i) a eleva\xE7\xE3o dos pre\xE7os do petr\xF3\
    leo, em decorr\xEAncia dos conflitos no Oriente M\xE9dio; (ii) os efeitos clim\xE1\
    ticos associados ao fen\xF4meno <i>El Ni\xF1o</i>, com impactos sobre produtividade\
    \ agr\xEDcola e custos de energia; (iii) os efeitos do fim da escala 6X1 sobre\
    \ os custos do trabalho e; (iv) a deprecia\xE7\xE3o da taxa de c\xE2mbio, em fun\xE7\
    \xE3o de incertezas relacionadas \xE0 pol\xEDtica dom\xE9stica. O Comit\xEA avalia\
    \ que a desacelera\xE7\xE3o mais acentuada da demanda agregada, com proje\xE7\xF5\
    es de crescimento do PIB abaixo do seu potencial, sugere a possibilidade de redu\xE7\
    \xE3o do risco de transmiss\xE3o desses choques para efeitos secund\xE1rios, que\
    \ poderiam se propagar e gerar press\xF5es inflacion\xE1rias mais persistentes.</p><p\
    \ class=\"paragrafo\">11. O Comit\xEA se debru\xE7ou ent\xE3o sobre as proje\xE7\
    \xF5es. No cen\xE1rio de refer\xEAncia, a trajet\xF3ria para a taxa de juros \xE9\
    \ extra\xEDda da pesquisa Focus e a taxa de c\xE2mbio parte de R$5,20/US$<sup>2</sup>,\
    \ evoluindo segundo a paridade do poder de compra (PPC). O pre\xE7o do petr\xF3\
    leo segue aproximadamente a curva futura pelos pr\xF3ximos seis meses e passa\
    \ a aumentar 2% ao ano posteriormente, conforme governan\xE7a usual. Dada a curva\
    \ de futuros do Brent observada, essa governan\xE7a se traduziu em trajet\xF3\
    ria decrescente ao longo da segunda metade do ano. Al\xE9m disso, adota-se a hip\xF3\
    tese de bandeira tarif\xE1ria \u201Cverde\u201D para tarifas de energia el\xE9\
    trica em dezembro de 2026. O Comit\xEA continuar\xE1 acompanhando os dados para\
    \ calibrar e refinar os impactos das medidas de est\xEDmulo \xE0 demanda e dos\
    \ choques de oferta.</p><p class=\"paragrafo\">12. No cen\xE1rio de refer\xEA\
    ncia, as proje\xE7\xF5es para a infla\xE7\xE3o acumulada em quatro trimestres\
    \ para 2026, 2027, e para o segundo trimestre de 2028, atual horizonte relevante\
    \ de pol\xEDtica monet\xE1ria, s\xE3o, respectivamente, 5,6%, 4,7%, e 3,5%.</p><p\
    \ class=\"paragrafo\">13. Os riscos para a infla\xE7\xE3o, tanto de alta quanto\
    \ de baixa, permanecem mais elevados que o usual, com assimetria altista. Entre\
    \ os riscos de alta para o cen\xE1rio inflacion\xE1rio e as expectativas de infla\xE7\
    \xE3o, destacam-se (i) uma desancoragem das expectativas de infla\xE7\xE3o por\
    \ per\xEDodo mais prolongado, com horizontes mais longos incorporando impactos\
    \ potenciais de segunda ordem de choques de oferta, relacionados ao petr\xF3leo\
    \ e seus derivados, e a efeitos clim\xE1ticos sobre a produtividade agr\xEDcola\
    \ e custos de energia; (ii) uma maior resili\xEAncia na infla\xE7\xE3o de servi\xE7\
    os do que a projetada em fun\xE7\xE3o de um hiato do produto positivo; (iii) uma\
    \ conjun\xE7\xE3o de pol\xEDticas econ\xF4micas externa e interna que tenham impacto\
    \ inflacion\xE1rio maior que o esperado, por exemplo, por meio de uma taxa de\
    \ c\xE2mbio persistentemente mais depreciada; e (iv) est\xEDmulos \xE0 demanda\
    \ agregada, em particular ao componente de consumo, que tenham como resultado\
    \ o crescimento da atividade econ\xF4mica acima do produto potencial, enfraquecendo\
    \ parte dos canais usuais de transmiss\xE3o da pol\xEDtica monet\xE1ria. Entre\
    \ os riscos de baixa, ressaltam-se (i) uma eventual desacelera\xE7\xE3o da atividade\
    \ econ\xF4mica dom\xE9stica mais acentuada do que a projetada, tendo impactos\
    \ sobre o cen\xE1rio de infla\xE7\xE3o; (ii) uma desacelera\xE7\xE3o global mais\
    \ pronunciada decorrente dos choques de com\xE9rcio e do petr\xF3leo, e de condi\xE7\
    \xF5es financeiras mais restritivas, em um cen\xE1rio de maior incerteza; e (iii)\
    \ uma redu\xE7\xE3o nos pre\xE7os das <i>commodities</i> com efeitos desinflacion\xE1\
    rios.</p><h3 class=\"secao\">C) Discuss\xE3o sobre a condu\xE7\xE3o da pol\xED\
    tica monet\xE1ria</h3><p class=\"paragrafo\">14. O Copom passou ent\xE3o \xE0\
    \ discuss\xE3o da condu\xE7\xE3o da pol\xEDtica monet\xE1ria, considerando o conjunto\
    \ de proje\xE7\xF5es analisado, assim como o balan\xE7o de riscos para a infla\xE7\
    \xE3o prospectiva.</p><p class=\"paragrafo\">15. O Comit\xEA avalia que as evid\xEA\
    ncias de transmiss\xE3o da pol\xEDtica monet\xE1ria contracionista para a atividade\
    \ econ\xF4mica t\xEAm se acumulado gradualmente. Embora a pol\xEDtica monet\xE1\
    ria esteja contribuindo de forma determinante para o processo de desinfla\xE7\xE3\
    o, a infla\xE7\xE3o permanece pressionada pela demanda, exigindo que a pol\xED\
    tica monet\xE1ria mantenha car\xE1ter restritivo.</p><p class=\"paragrafo\">16.\
    \ Choques de oferta t\xEAm exercido influ\xEAncia relevante tanto sobre a trajet\xF3\
    ria recente da infla\xE7\xE3o quanto sobre sua trajet\xF3ria prospectiva. O Copom\
    \ avalia que n\xE3o deve reagir aos efeitos prim\xE1rios de choques dessa natureza,\
    \ mas que \xE9 necess\xE1rio monitorar com aten\xE7\xE3o eventuais efeitos de\
    \ segunda ordem, e reagir com firmeza caso esses efeitos se materializem.</p><h3\
    \ class=\"secao\">D) Decis\xE3o de pol\xEDtica monet\xE1ria</h3><p class=\"paragrafo\"\
    >17. O Copom decidiu manter a taxa Selic em 13,75% a.a., e entende que essa decis\xE3\
    o \xE9 compat\xEDvel com a estrat\xE9gia de converg\xEAncia da infla\xE7\xE3o\
    \ para o redor da meta ao longo do horizonte relevante. Sem preju\xEDzo de seu\
    \ objetivo fundamental de assegurar a estabilidade de pre\xE7os, essa decis\xE3\
    o tamb\xE9m implica suaviza\xE7\xE3o das flutua\xE7\xF5es do n\xEDvel de atividade\
    \ econ\xF4mica e fomento do pleno emprego.</p><p class=\"paragrafo\">18. O contexto\
    \ atual, caracterizado por taxa Selic substancialmente contracionista, aumento\
    \ significativo das incertezas em torno do cen\xE1rio base, expectativas de infla\xE7\
    \xE3o mais elevadas, e desacelera\xE7\xE3o da atividade econ\xF4mica dom\xE9stica\
    \ mais acentuada, apresenta um cen\xE1rio desafiador para a pol\xEDtica monet\xE1\
    ria, demandando serenidade e cautela na sua condu\xE7\xE3o. O Comit\xEA seguir\xE1\
    \ acompanhando a evolu\xE7\xE3o do cen\xE1rio, para manter a restri\xE7\xE3o adequada\
    \ de forma a assegurar a converg\xEAncia da infla\xE7\xE3o \xE0 meta.</p><p class=\"\
    paragrafo\">19. Votaram por essa decis\xE3o os seguintes membros do Comit\xEA\
    : Gabriel Muricca Gal\xEDpolo (presidente), Ailton de Aquino Santos, Gilneu Francisco\
    \ Astolfi Vivan, Izabela Moreira Correa, Nilton Jos\xE9 Schneider David, Paulo\
    \ Picchetti, e Rodrigo Alves Teixeira.</p><p class=\"paragrafo\"><b>Tabela 1</b></p><p\
