  date: '2026-10-09T22:43:57.960736'
  description: "<div id=\"atacompleta\"><div id=\"ataconteudo\"><h3 class=\"secao\"\
    >A) Atualiza\xE7\xE3o da conjuntura econ\xF4mica e do cen\xE1rio do Copom<sup>1</sup></h3><p\
    \ class=\"paragrafo\">1. O ambiente externo permanece incerto em fun\xE7\xE3o\
    \ da indefini\xE7\xE3o acerca dos conflitos armados no Oriente M\xE9dio e da incerteza\
    \ sobre a pol\xEDtica monet\xE1ria em algumas economias avan\xE7adas. Tal cen\xE1\
    rio exige cautela por parte de pa\xEDses emergentes em ambiente marcado por eleva\xE7\
    \xE3o da volatilidade de pre\xE7os de ativos e <i>commodities</i>.</p><p class=\"\
    paragrafo\">2. Em rela\xE7\xE3o ao cen\xE1rio dom\xE9stico, o conjunto dos indicadores\
    \ divulgados desde a \xFAltima reuni\xE3o mostra uma modera\xE7\xE3o gradual da\
    \ atividade econ\xF4mica, principalmente em setores mais c\xEDclicos, embora ainda\
    \ em patamar resiliente e mercado de trabalho aquecido. Nas divulga\xE7\xF5es\
    \ mais recentes, a infla\xE7\xE3o cheia e a m\xE9dia de medidas subjacentes desaceleraram,\
    \ situando-se abaixo do limite superior do intervalo de toler\xE2ncia, por\xE9\
    m ainda acima da meta.</p><p class=\"paragrafo\">3. As expectativas de infla\xE7\
    \xE3o para 2026 e 2027 apuradas pela pesquisa Focus permanecem em valores acima\
    \ da meta, situando-se em 4,9% e 4,3%, respectivamente. A proje\xE7\xE3o de infla\xE7\
    \xE3o do Copom para o primeiro trimestre de 2028, atual horizonte relevante de\
    \ pol\xEDtica monet\xE1ria, situa-se em 3,2% no cen\xE1rio de refer\xEAncia (Tabela\
    \ 1).</p><h3 class=\"secao\">B) Cen\xE1rios e an\xE1lise de riscos</h3><p class=\"\
    paragrafo\">4. A incerteza com rela\xE7\xE3o ao cen\xE1rio externo segue em n\xED\
    veis elevados. A continuidade de indefini\xE7\xF5es em rela\xE7\xE3o aos desdobramentos\
    \ das tens\xF5es geopol\xEDticas e seus efeitos sobre pre\xE7os de <i>commodities</i>\
    \ e insumos alteraram expectativas sobre a condu\xE7\xE3o da pol\xEDtica monet\xE1\
    ria nas principais economias avan\xE7adas.</p><p class=\"paragrafo\">5. A atividade\
    \ econ\xF4mica dom\xE9stica manteve trajet\xF3ria de modera\xE7\xE3o, tal como\
    \ antecipado pelo Comit\xEA. A leitura mais recente do PIB, referente ao segundo\
    \ trimestre de 2026, confirmou a desacelera\xE7\xE3o apontada por outros indicadores\
    \ e revelou que o movimento foi mais intenso nas atividades econ\xF4micas e nos\
    \ componentes da demanda mais sens\xEDveis ao ciclo econ\xF4mico. O Comit\xEA\
    \ relembra que o arrefecimento da demanda agregada \xE9 um elemento essencial\
    \ do processo de reequil\xEDbrio entre oferta e demanda da economia e converg\xEA\
    ncia da infla\xE7\xE3o \xE0 meta.</p><p class=\"paragrafo\">6. A evolu\xE7\xE3\
    o do mercado de cr\xE9dito banc\xE1rio com recursos livres tamb\xE9m \xE9 consistente\
    \ com um quadro de desacelera\xE7\xE3o do crescimento, em meio a uma pol\xEDtica\
    \ monet\xE1ria restritiva. Nota-se, em particular, redu\xE7\xE3o nas modalidades\
    \ de mais longo prazo, mais sens\xEDveis \xE0 pol\xEDtica monet\xE1ria que as\
    \ modalidades de curto prazo ou emergenciais, mais onerosas. Estas continuaram\
    \ crescendo, por\xE9m com desacelera\xE7\xE3o na margem. Por outro lado, os cr\xE9\
    ditos com recursos direcionados mantiveram trajet\xF3ria de expans\xE3o para pessoas\
    \ f\xEDsicas, na linha do cr\xE9dito imobili\xE1rio, e para empresas, sustentados\
    \ pelas opera\xE7\xF5es com fundos garantidores.</p><p class=\"paragrafo\">7.\
    \ O Comit\xEA segue acompanhando detidamente o mercado de trabalho. A taxa de\
    \ desemprego mant\xE9m-se em patamares historicamente baixos, enquanto o crescimento\
    \ da taxa de ocupa\xE7\xE3o vem apresentando desacelera\xE7\xE3o. Os rendimentos\
    \ m\xE9dios desaceleraram na margem, mesmo em termos nominais, mas ainda crescem\
    \ em termos reais a uma taxa superior \xE0 da produtividade do trabalho. O Comit\xEA\
    \ segue atento ao debate sobre as dimens\xF5es corrente e estrutural do mercado\
    \ de trabalho, enfatizando a necessidade do aprofundamento dessa an\xE1lise para\
    \ a avalia\xE7\xE3o dos padr\xF5es de transmiss\xE3o dos n\xEDveis de ocupa\xE7\
    \xE3o para os rendimentos do trabalho e, finalmente, para os pre\xE7os dos diversos\
    \ setores da economia.</p><p class=\"paragrafo\">8. A pol\xEDtica fiscal tem um\
    \ impacto de curto prazo, majoritariamente por meio de est\xEDmulo \xE0 demanda\
    \ agregada, e uma dimens\xE3o mais estrutural, que tem potencial de afetar a percep\xE7\
    \xE3o sobre a sustentabilidade da d\xEDvida e impactar o pr\xEAmio a termo da\
    \ curva de juros. Uma pol\xEDtica fiscal que atue de forma contrac\xEDclica e\
    \ contribua para a redu\xE7\xE3o do pr\xEAmio de risco favorece a converg\xEA\
    ncia da infla\xE7\xE3o \xE0 meta. O Comit\xEA reafirma a vis\xE3o de que o esmorecimento\
    \ no esfor\xE7o de reformas estruturais e disciplina fiscal, o aumento de cr\xE9\
    dito direcionado e as incertezas sobre a estabiliza\xE7\xE3o da d\xEDvida p\xFA\
    blica t\xEAm o potencial de elevar a taxa de juros neutra da economia, com impactos\
    \ delet\xE9rios sobre a pot\xEAncia da pol\xEDtica monet\xE1ria e, consequentemente,\
    \ sobre o custo de desinfla\xE7\xE3o em termos de atividade. O Comit\xEA mant\xE9\
    m a firme convic\xE7\xE3o de que as pol\xEDticas devem ser previs\xEDveis, cr\xED\
    veis e antic\xEDclicas. Em particular, o debate do Comit\xEA refor\xE7a, novamente,\
    \ a necessidade de pol\xEDticas fiscal e monet\xE1ria harmoniosas.</p><p class=\"\
    paragrafo\">9. As leituras mais recentes apontam para queda da infla\xE7\xE3o\
    \ ao consumidor, tanto no \xEDndice cheio quanto na m\xE9dia das medidas subjacentes.\
    \ Pelas duas m\xE9tricas, o \xEDndice acumulado em 12 meses situa-se abaixo do\
    \ limite superior do intervalo de toler\xE2ncia, por\xE9m ainda acima da meta.\
    \ Ainda sob a mesma perspectiva das varia\xE7\xF5es acumuladas em 12 meses, nas\
    \ divulga\xE7\xF5es mais recentes as varia\xE7\xF5es de pre\xE7os aos produtores\
    \ aceleraram, tanto em bens intermedi\xE1rios quanto em bens de consumo.</p><p\
    \ class=\"paragrafo\">10. As expectativas de infla\xE7\xE3o, medidas por diferentes\
    \ instrumentos e obtidas de diferentes grupos de agentes permanecem acima da meta\
    \ de infla\xE7\xE3o em todos os horizontes. Foi ressaltado que o custo de desinfla\xE7\
    \xE3o sobre o n\xEDvel de atividade ao longo do tempo \xE9 maior em ambientes\
    \ com expectativas desancoradas. O Comit\xEA monitora com aten\xE7\xE3o a desancoragem\
    \ das expectativas de infla\xE7\xE3o para prazos mais longos e tem debatido as\
    \ poss\xEDveis causas desse movimento das expectativas. O Comit\xEA avalia que\
    \ perseveran\xE7a, firmeza e serenidade na condu\xE7\xE3o da pol\xEDtica monet\xE1\
    ria contribuir\xE3o para a reancoragem das expectativas, importante para a converg\xEA\
    ncia da infla\xE7\xE3o \xE0 meta com menor custo. A principal conclus\xE3o obtida,\
    \ e compartilhada por todos os membros do Comit\xEA, foi a de que, em um ambiente\
    \ de expectativas desancoradas, como \xE9 o caso do atual, exige-se uma restri\xE7\
    \xE3o monet\xE1ria maior e por mais tempo do que outrora seria apropriado.</p><p\
    \ class=\"paragrafo\">11. O Comit\xEA se debru\xE7ou ent\xE3o sobre as proje\xE7\
    \xF5es. No cen\xE1rio de refer\xEAncia, a trajet\xF3ria para a taxa de juros \xE9\
    \ extra\xEDda da pesquisa Focus e a taxa de c\xE2mbio parte de R$5,15/US$<sup>2</sup>,\
    \ evoluindo segundo a paridade do poder de compra (PPC). O pre\xE7o do petr\xF3\
    leo segue aproximadamente a curva futura pelos pr\xF3ximos seis meses e passa\
    \ a aumentar 2% ao ano posteriormente, conforme governan\xE7a usual. Dada a curva\
    \ de futuros do Brent observada, essa governan\xE7a se traduziu em trajet\xF3\
    ria decrescente ao longo da segunda metade do ano. Al\xE9m disso, adota-se a hip\xF3\
    tese de bandeira tarif\xE1ria \u201Camarela\u201D para tarifas de energia el\xE9\
    trica em dezembro de 2026. O Comit\xEA continuar\xE1 acompanhando os dados para\
    \ calibrar e refinar os impactos das medidas de est\xEDmulo \xE0 demanda e dos\
    \ choques de oferta.</p><p class=\"paragrafo\">12. No cen\xE1rio de refer\xEA\
    ncia, as proje\xE7\xF5es para a infla\xE7\xE3o acumulada em quatro trimestres\
    \ para 2026, 2027, e para o primeiro trimestre de 2028, atual horizonte relevante\
    \ de pol\xEDtica monet\xE1ria, s\xE3o, respectivamente, 5,2%, 3,9%, e 3,2%.</p><p\
    \ class=\"paragrafo\">13. Os riscos para a infla\xE7\xE3o, tanto de alta quanto\
    \ de baixa, permanecem mais elevados que o usual, com assimetria altista. Entre\
    \ os riscos de alta para o cen\xE1rio inflacion\xE1rio e as expectativas de infla\xE7\
    \xE3o, destacam-se (i) uma desancoragem das expectativas de infla\xE7\xE3o por\
    \ per\xEDodo mais prolongado, com horizontes mais longos incorporando impactos\
    \ potenciais de segunda ordem de choques de oferta, relacionados ao petr\xF3leo\
    \ e seus derivados, e a efeitos clim\xE1ticos sobre a produtividade agr\xEDcola\
    \ e custos de energia; (ii) uma maior resili\xEAncia na infla\xE7\xE3o de servi\xE7\
    os do que a projetada em fun\xE7\xE3o de um hiato do produto mais positivo; (iii)\
    \ uma conjun\xE7\xE3o de pol\xEDticas econ\xF4micas externa e interna que tenham\
    \ impacto inflacion\xE1rio maior que o esperado, por exemplo, por meio de uma\
    \ taxa de c\xE2mbio persistentemente mais depreciada; e (iv) est\xEDmulos \xE0\
    \ demanda agregada, em particular ao componente de consumo, que tenham como resultado\
    \ o crescimento da atividade econ\xF4mica acima do produto potencial, enfraquecendo\
    \ parte dos canais usuais de transmiss\xE3o da pol\xEDtica monet\xE1ria. Entre\
    \ os riscos de baixa, ressaltam-se (i) uma eventual desacelera\xE7\xE3o da atividade\
    \ econ\xF4mica dom\xE9stica mais acentuada do que a projetada, tendo impactos\
    \ sobre o cen\xE1rio de infla\xE7\xE3o; (ii) uma desacelera\xE7\xE3o global mais\
    \ pronunciada decorrente dos choques de com\xE9rcio e do petr\xF3leo, e de um\
    \ cen\xE1rio de maior incerteza; e (iii) uma redu\xE7\xE3o nos pre\xE7os das <i>commodities</i>\
    \ com efeitos desinflacion\xE1rios.</p><h3 class=\"secao\">C) Discuss\xE3o sobre\
    \ a condu\xE7\xE3o da pol\xEDtica monet\xE1ria</h3><p class=\"paragrafo\">14.\
    \ O Copom passou ent\xE3o \xE0 discuss\xE3o da condu\xE7\xE3o da pol\xEDtica monet\xE1\
    ria, considerando o conjunto de proje\xE7\xF5es analisado, assim como o balan\xE7\
    o de riscos para a infla\xE7\xE3o prospectiva.</p><p class=\"paragrafo\">15. O\
    \ Comit\xEA avalia que as evid\xEAncias de transmiss\xE3o da pol\xEDtica monet\xE1\
    ria contracionista para a atividade econ\xF4mica t\xEAm se acumulado gradualmente.\
    \ Embora a pol\xEDtica monet\xE1ria esteja contribuindo de forma determinante\
    \ para o processo de desinfla\xE7\xE3o, a infla\xE7\xE3o permanece pressionada\
    \ pela demanda, exigindo que a pol\xEDtica monet\xE1ria mantenha car\xE1ter restritivo.</p><p\
    \ class=\"paragrafo\">16. Choques de oferta t\xEAm exercido influ\xEAncia relevante\
    \ tanto sobre a trajet\xF3ria recente da infla\xE7\xE3o quanto sobre sua trajet\xF3\
    ria prospectiva. O Copom avalia que que n\xE3o deve reagir aos efeitos prim\xE1\
    rios de choques dessa natureza, mas que \xE9 necess\xE1rio monitorar com aten\xE7\
    \xE3o eventuais efeitos de segunda ordem, e reagir com firmeza caso esses efeitos\
    \ se materializem.</p><p class=\"paragrafo\">17. No contexto atual de incerteza\
    \ em n\xEDveis historicamente elevados, com riscos assim\xE9tricos na dire\xE7\
    \xE3o altista para os pre\xE7os, o Comit\xEA reitera que a magnitude do ciclo\
    \ de calibra\xE7\xE3o ser\xE1 ajustada \xE0 luz da evolu\xE7\xE3o do cen\xE1rio,\
    \ de forma a manter a restri\xE7\xE3o adequada para assegurar a converg\xEAncia\
    \ da infla\xE7\xE3o \xE0 meta.</p><h3 class=\"secao\">D) Decis\xE3o de pol\xED\
    tica monet\xE1ria</h3><p class=\"paragrafo\">18. O Copom decidiu reduzir a taxa\
    \ b\xE1sica de juros para 13,75% a.a., e entende que essa decis\xE3o \xE9 compat\xED\
    vel com a estrat\xE9gia de converg\xEAncia da infla\xE7\xE3o para o redor da meta\
    \ ao longo do horizonte relevante. Sem preju\xEDzo de seu objetivo fundamental\
    \ de assegurar a estabilidade de pre\xE7os, essa decis\xE3o tamb\xE9m implica\
    \ suaviza\xE7\xE3o das flutua\xE7\xF5es do n\xEDvel de atividade econ\xF4mica\
    \ e fomento do pleno emprego.</p><p class=\"paragrafo\">19. O cen\xE1rio atual,\
    \ caracterizado por significativo aumento da incerteza, desancoragem das expectativas\
    \ e riscos elevados em torno do cen\xE1rio base, demanda serenidade e cautela\
    \ na condu\xE7\xE3o da pol\xEDtica monet\xE1ria. O Comit\xEA seguir\xE1 incorporando\
    \ novas informa\xE7\xF5es e acompanhando a evolu\xE7\xE3o do cen\xE1rio de forma\
    \ a manter a restri\xE7\xE3o adequada para assegurar a converg\xEAncia da infla\xE7\
    \xE3o \xE0 meta.</p><p class=\"paragrafo\">20. Votaram por essa decis\xE3o os\
    \ seguintes membros do Comit\xEA: Gabriel Muricca Gal\xEDpolo (presidente), Ailton\
    \ de Aquino Santos, Gilneu Francisco Astolfi Vivan, Izabela Moreira Correa, Nilton\
    \ Jos\xE9 Schneider David, Paulo Picchetti, e Rodrigo Alves Teixeira.</p><p class=\"\
    paragrafo\"><b>Tabela 1</b></p><p class=\"paragrafo\"><b>Proje\xE7\xF5es de infla\xE7\
    \xE3o no cen\xE1rio de refer\xEAncia</b></p><p class=\"paragrafo\">Varia\xE7\xE3\
    o do IPCA acumulada em quatro trimestres (%)</p><div class=\"arealivre\"><table\
