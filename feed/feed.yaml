  date: '2026-11-02T12:00:00+00:00'
  description: "In this post, we discuss insights from a recent\_<a href=\"https://www.newyorkfed.org/research/staff_reports/sr1168\"\
    \ rel=\"noreferrer noopener\" target=\"_blank\">staff report</a>\_on the role\
    \ of banking supervision in\_identifying\_and disciplining failing banks.\_We\
    \ show that bank failures typically result from supervisory closure decisions\
    \ based on hard information about book equity. Yet hard information is itself\
    \ partly produced by supervision, as our evidence suggests that supervisors require\
    \ troubled banks to recognize potential losses.\_We argue that supervision faces\
    \ a trade-off: Stricter supervision\_can\_reduce\_the costs of resolving failing\
    \ banks,\_but it can also lead to tighter regulatory capital constraints and hold\
    \ back credit supply."
