  date: '2026-08-03T00:00:00+00:00'
  description: "My guest this episode is Stacie Mintz, Managing Director and Head\
    \ of Quantitative Equity at PGIM Quantitative Solutions.Stacie has spent 33 years\
    \ at PGIM, and she's been there for every defining moment of the firm's quant\
    \ equity effort: a first strategy born from a client's challenge to move beyond\
    \ indexing, a 1999 decision to abandon Barra and bring the risk model in-house,\
    \ surviving the quant quake of August 2007, and the post-GFC realization that\
    \ in a crowded-factor world, it's not enough to be a quant \u2014 you have to\
    \ be a different quant.We dig into what PGIM's \"fundamental quant\" label actually\
    \ means in practice, from a financing factor that asks how a company funds its\
    \ growth, to a factor taxonomy that includes an unfamiliar Linkages group and\
    \ \u2014 unusually for a quant shop \u2014 excludes momentum entirely.In the back\
    \ half, we turn to the frontier: turning qualitative signals like board composition\
    \ and innovation into systematic factors, building models that assess emergent\
    \ shocks like COVID and AI in real time, and why Stacie calls LLMs \"bazookas\"\
    \ \u2014 tools powerful enough to blow up what already works, which is exactly\
    \ why you start with the insight and only then reach for the tool.Please enjoy\
    \ my conversation with Stacie Mintz."
