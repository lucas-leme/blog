  description: "As fall starts to show itself in cooler weather, I want to discuss\
    \ a topic that usually raises temperatures: inflation. Like a budget-conscious\
    \ consumer, the Federal Reserve is highly attuned to changes in the price of goods\
    \ and services; minimizing such swings is one of the Fed\u2019s primary duties,\
    \ after all. But how does the Fed\u2019s view of prices differ from that of a\
    \ consumer? And how does the Fed go about stabilizing prices writ large when it\
    \ lacks the ability to set prices directly? In this post, I explore that apparent\
    \ paradox from the perspective of a central banker (though I remain a budget-conscious\
    \ consumer when off duty)."
