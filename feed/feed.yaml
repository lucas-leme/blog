    aram 1% das aloca\xE7\xF5es em fundos \u2013 e h\xE1 espa\xE7o para crescer muito\
    \ mais. Nos Estados Unidos, s\xE3o 30%.A revolu\xE7\xE3o dos ETFs chegou ao Brasil.\
    \ Para entender como isso aconteceu e o que vem por a\xED, no Outliers #193 Clara\
    \ Sodr\xE9 e Fabiano Cintra conversam com Danilo Gabriel, s\xF3cio da XP e gestor\
