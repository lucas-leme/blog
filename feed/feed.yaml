  description: "O que a intelig\xEAncia artificial faz melhor na gest\xE3o de investimentos\
    \ \u2013 e quais caracter\xEDsticas dos humanos se tornaram ainda mais importantes\
    \ agora?Para entender o papel da IA na tomada de decis\xF5es, Clara Sodr\xE9,\
    \ analista de fundos da XP, aproveitou a Expert XP 2026 para entrevistar Alexandre\
    \ Muller, CIO da Leto Capital. \u201CSe voc\xEA gosta de ter acesso a conte\xFA\
    dos, de trocar uma ideia, de testar uma hip\xF3tese, a ferramenta \xE9 brilhante.\
    \ Vai te acelerar como pessoa, como profissional\u201D, afirma. \u201CAgora, se\
