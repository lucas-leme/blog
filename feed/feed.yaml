  description: "A publicidade mudou \u2014 e as empresas que ainda pensam apenas em\
    \ TV, digital, performance ou campanhas isoladas podem estar olhando para o problema\
    \ errado.Neste epis\xF3dio do Market Makers, Thiago Salom\xE3o e Leopoldo Rosa\
    \ recebem Carolina Buzetto, CEO e cofundadora da WPP Media Brasil, e Fernanda\
    \ Tedde, CEO da Fbiz, para entender como funciona uma das maiores ind\xFAstrias\
    \ do mundo: publicidade, m\xEDdia e constru\xE7\xE3o de marcas.Como uma ag\xEA\
    ncia ganha dinheiro? Como as grandes empresas decidem onde investir sua verba\
    \ de m\xEDdia? Ainda vale anunciar na televis\xE3o? Performance realmente constr\xF3\
