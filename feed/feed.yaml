  description: In this episode of Conversations with Frank Fabozzi, CFA, Til Schuermann
    examines how portfolio managers can navigate an increasingly uncertain and interconnected
    risk environment. Drawing on his experience as Partner and Global Head of Finance
    and Risk at Oliver Wyman and his previous work at the Federal Reserve Bank of
    New York, he explores stress testing, model risk, liquidity, private credit, regulation,
    and the vulnerabilities that can emerge during periods of market disruption.
