  description: "Americans are moving less than they used to. <a href=\"https://www.census.gov/data/tables/time-series/demo/geographic-mobility/historic.html\"\
    >Moving rates</a> have declined steadily for decades, falling from close to 20\
    \ percent annually in the mid-1980s to below 10 percent by 2019. This decline\
    \ has <a href=\"https://www.sciencedirect.com/science/article/pii/S0304407621000415\"\
    >persisted</a> through business cycles and has been evident across all regions,\
    \ and has affected a broad range of demographic groups. Falling mobility matters\
    \ because moving helps households access job opportunities, adjust to changing\
    \ circumstances, and improve their housing situations. In this post, we show that\
    \ the decline in mobility also holds for renters, with growing challenges to owning\
    \ a home being an important contributing factor. \_We use data from the annual\
    \ New York Fed SCE Housing Survey to study renters\u2019 expected mobility and\
    \ the factors that shape it. Renter mobility is important as renters account for\
    \ roughly a third of U.S. households and, unlike homeowners, are not subject to\
    \ mortgage rate <a href=\"https://libertystreeteconomics.newyorkfed.org/2024/05/mortgage-rate-lock-in-and-homeowners-moving-plans/\"\
    >lock-in.</a>\_Since expected mobility <a href=\"https://www.sciencedirect.com/science/article/pii/S0304407621000415\"\
    >predicts</a> actual moving behavior, it provides an early signal of where residential\
    \ mobility is headed before moves occur."
  image: https://d3g9pb5nvr3u7.cloudfront.net/sites/59dd2d9d016a1b2d929cd15b/-1445257209/256.jpg
  path: https://libertystreeteconomics.newyorkfed.org/2026/08/why-do-fewer-renters-expect-to-move/
  title: Why Do Fewer Renters Expect to Move?
